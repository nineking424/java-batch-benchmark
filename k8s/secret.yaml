apiVersion: v1
kind: Secret
metadata:
  name: benchmark-db-secret
  namespace: benchmark
  labels:
    app: java-batch-benchmark
    component: secret
type: Opaque
# Note: In production, use external secret management (e.g., Vault, AWS Secrets Manager)
# or Kubernetes external-secrets operator
# These are base64 encoded values - replace with your actual credentials
# echo -n 'benchmark_user' | base64 = YmVuY2htYXJrX3VzZXI=
# echo -n 'benchmark_password' | base64 = YmVuY2htYXJrX3Bhc3N3b3Jk
data:
  DB_USERNAME: YmVuY2htYXJrX3VzZXI=
  DB_PASSWORD: YmVuY2htYXJrX3Bhc3N3b3Jk

---
# Alternative: Use stringData for non-encoded values (Kubernetes will encode them)
# Uncomment and modify if you prefer this approach
# apiVersion: v1
# kind: Secret
# metadata:
#   name: benchmark-db-secret
#   namespace: benchmark
# type: Opaque
# stringData:
#   DB_USERNAME: "your_username"
#   DB_PASSWORD: "your_password"
